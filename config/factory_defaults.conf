################################################################################
#                      BirdSuite — the defaults of every setting                #
################################################################################
# US-121 (owner 2026-10-20): every behaviour setting of the program with its
# default value (set from the pilot station's settings, 2026-10-20). Read-only: it ships with each release (the
# only file of config/ in git) and is replaced by an update. The station's own values live in BirdSuite.conf beside
# it (config/, owner 2026-10-22); the web pages and the Python engine read this file first and BirdSuite.conf over
# it, so a key missing from BirdSuite.conf takes the value below. A new installation writes BirdSuite.conf from this
# file plus the answers of the first run; an update adds to BirdSuite.conf every key it lacks,
# with its value here. System › Defaults compares both and resets a key.
#
# Not here — set by the installation for this station: SITE_NAME, LATITUDE,
# LONGITUDE, SPECIES_LIST, DATABASE_LANG, BIRDNET_USER, RECS_DIR, PROCESSED,
# EXTRACTED, IDFILE, REC_CARD, UPDATE_BRANCH, passwords, tokens and URLs
# (CADDY_PWD, CADDY_USER, ICE_PWD, BIRDWEATHER_ID, FLICKR_*, NOTIFICATION_EMAIL,
# HEARTBEAT_URL, BIRDNETPI_URL, RTSP_STREAM, SOUND_REPO_*), CUSTOM_IMAGE*,
# STATION_LAYER, DATA_MODEL_VERSION, LAST_RUN, THIS_RUN.
################################################################################

#--------------------------- Locations and stations ----------------------------#
## Simple mode (owner 2026-10-29, US-125): asked at the installation; the data stays the same either way
## MULTI_LOCATION: 1 = several locations (home, farm, trips): the Loc: picker, the location in the header and in the
## lists, the list of locations and New location; 0 = one place, those controls hidden
MULTI_LOCATION=0
## MULTI_STATION: 1 = several BirdSuite stations: the station list in the header, System › Stations, Move to station;
## 0 = one station, those controls hidden
MULTI_STATION=0

#--------------------------------- Model --------------------------------------#
## MODEL: the BirdNET model that analyses the audio (Settings › Model)
MODEL=BirdNET-Plus_V3.0-preview3.1_Global_10K
## SF_THRESH: Min. Prob. — species the location model expects here this week below this probability are left out
## (factory 0.05, owner 2026-10-27: little junk comes from Min. Conf., the location filter only drops the impossible;
## 0.3 from 2026-10-26, 0.03 as Cornell until then)
SF_THRESH=0.05
## APPRISE_NOTIFY_REGION_RARE: 1 = species the location model does not expect here go to the Rare notification channel
APPRISE_NOTIFY_REGION_RARE=1
## PURGE_PROTECT_TOP_N: the best N detections of every species are never purged (plus confirmed reviews)
PURGE_PROTECT_TOP_N=50
## IGNORED_PURGE_DAYS: the audio of the detections answered Dog, Human, Engine, Noise or Ignore is deleted by itself this
## many days after the detection (the detections keep counting); 0 = only by hand (Tools › Data › Purge Ignored)
IGNORED_PURGE_DAYS=5
## PURGE_RECENT_DAYS: the clips of the last N days are never trimmed by the per-species limit (MAX_FILES_SPECIES); 3 since
## 2026-10-29 (owner, was 5)
PURGE_RECENT_DAYS=3

## NOCTURNAL_DAWN_MARGIN / NOCTURNAL_DUSK_MARGIN: the species of Lists > Nocturnal are dropped by day, from this many
## minutes after sunrise to this many minutes before sunset (twilight is kept)
NOCTURNAL_DAWN_MARGIN=30
NOCTURNAL_DUSK_MARGIN=30
## MAX_FILES_SPECIES_DAY: in each day, a species keeps its N clips of highest confidence (0 = no daily cap); the
## protected clips are never deleted and the detections keep counting (50 by default, owner 2026-10-24)
MAX_FILES_SPECIES_DAY=50
## AVOID_DUPLICITY: 1 = keep only the highest-confidence species of each recording (fewer species), 0 = every species above its minimum (default)
AVOID_DUPLICITY=0
## SHADOW_MODEL_NAME is a second model analysing the same audio into birds_shadow.db (empty = none)
## and SHADOW_ENABLED its switch (0 = off, the default) — Settings › Model
SHADOW_MODEL_NAME=BirdNET_GLOBAL_6K_V2.4_Model_FP16
SHADOW_ENABLED=0
## BIRDWEATHER_ENABLED: 1 = upload to BirdWeather (needs BIRDWEATHER_ID), 0 = paused (the token is kept); off by default
## (owner 2026-10-10): turn it on in Settings once the station is where it will stay
BIRDWEATHER_ENABLED=0

## RTSP_STREAM_TO_LIVESTREAM is the index, so 0 means the first stream
RTSP_STREAM_TO_LIVESTREAM="0"

#-----------------------  Apprise Miscellanous Configuration -------------------#

APPRISE_NOTIFICATION_TITLE="$common_name $conf_pct%"
APPRISE_NOTIFICATION_TITLE_RARE="RARE $common_name $conf_pct%"
APPRISE_NOTIFY_EACH_DETECTION=0
APPRISE_NOTIFY_NEW_SPECIES=1
APPRISE_NOTIFY_NEW_SPECIES_EACH_DAY=0
APPRISE_MIN_SEC_PER_SPECIES=120
APPRISE_EXCLUDE_SPECIES=""
APPRISE_ONLY_SPECIES=""
## ACTIVATE_BIRDDB: "true" = the BirdDB-Br section is shown in Settings › Repositories, "false" = hidden (default)
ACTIVATE_BIRDDB="false"
## BIRDDB_ENABLED: 1 = contribute this station's clips to BirdDB-Br, 0 = off (default)
BIRDDB_ENABLED=0
## SOUND_REPO_UPLOAD_MINUTES is the interval in minutes between uploads to the BirdDB-Br remote (0 = never)
SOUND_REPO_UPLOAD_MINUTES=0

## NOTIFICATION_DEFAULT_TIER is the tier (muted|normal|rare) for species without an entry in notification_tiers.txt
NOTIFICATION_DEFAULT_TIER=normal

#----------------------  Image Provider Configuration ------------------------#
## IMAGE_PROVIDER: bird photos from Wikipedia (fixed, every update sets it back; the photo source choice was retired)
IMAGE_PROVIDER=WIKIPEDIA

#----------------------  Site to pull info from Images  ------------------------#
## INFO_SITE: ALLABOUTBIRDS, EBIRD or WIKIAVES (no page shows that link since 2026-10-20; kept for older pages)

INFO_SITE=WIKIAVES

#-------------------------------  Color scheme  --------------------------------#
## light or dark
## default light

COLOR_SCHEME=light

#------------------------------  Disk Management  ------------------------------#
## FULL_DISK can be set to configure how the system reacts to a full disk
## purge = Remove the oldest day's worth of recordings
## keep = Keep all data and 'stop_core_services.sh'
## external = Move the oldest sounds (and those past the per-species limits) to FULL_DISK_PATH instead of deleting them

FULL_DISK=purge

## FULL_DISK_PATH: the external folder of FULL_DISK=external (a mounted share or disk, writable by the station user);
## FULL_DISK_FALLBACK: what happens when it cannot be used (not mounted, not writable, full, same disk):
## keep = remove nothing and stop the recording when the disk is full, purge = delete as FULL_DISK=purge

FULL_DISK_PATH=
FULL_DISK_FALLBACK=keep

## PURGE_THRESHOLD can be set to configure at what disk full percentage the
## purge operations are triggered.
PURGE_THRESHOLD=70

## Maximum amount of files to keep for a given specie (0 = keep all)
## Files from the last 7 days, and files protected from purge, are not taken into
## account in this number

MAX_FILES_SPECIES=100

## OVERLAP: seconds the 3 s analysis windows overlap (0.0-2.9)

OVERLAP=0

## CONFIDENCE: Min. Conf. — the lowest score a detection needs to be kept (0.01-0.99)

CONFIDENCE=0.4

## SENSITIVITY: Sigm. Sens. — bends the model's scores before Min. Conf. is applied (0.5-1.5)

SENSITIVITY=1.0

## Configuration of the frequency shifting feature, useful for earing impaired people.

## FREQSHIFT_TOOL

FREQSHIFT_TOOL=sox

## If the tool is ffmpeg, you have to define a freq. shift from HI to LO:
## FREQSHIFT_HI
FREQSHIFT_HI=6000
## FREQSHIFT_LO
FREQSHIFT_LO=3000

## FREQSHIFT_RECONNECT_DELAY
FREQSHIFT_RECONNECT_DELAY=4000

## SPECTROGRAM_HEIGHT is the height of the live spectrogram in percent of the page height (vh)
SPECTROGRAM_HEIGHT=70

## SPECTROGRAM_PALETTE is the colour palette of the spectrograms: birdnet (Classic), viridis, inferno, ocean, grayscale, soxheat, turbo, roseus
SPECTROGRAM_PALETTE=turbo
## SPECTROGRAM_SILENT: 1 = the live spectrogram draws without sound until the viewer unticks Silent (each browser keeps its choice)
SPECTROGRAM_SILENT=1
## SPECTROGRAM_COMPRESSION: 1 = the live audio goes through the dynamics compressor when it starts, 0 = off
SPECTROGRAM_COMPRESSION=0
## ACTIVATE_FREQSHIFT_IN_LIVESTREAM: "true" = the livestream is pitch-shifted (FREQSHIFT_*), "false" = off
ACTIVATE_FREQSHIFT_IN_LIVESTREAM="false"

## SPECTROGRAM_FLOOR_DB / SPECTROGRAM_RANGE_DB / SPECTROGRAM_CONTRAST: colour sensitivity of the spectrograms (US-42) —
## floor of the colour scale in dB (-120..-40), range above the floor in dB (30..120), contrast gamma (0.5..2, 1 = linear)
SPECTROGRAM_FLOOR_DB=-100
SPECTROGRAM_RANGE_DB=70
SPECTROGRAM_CONTRAST=1

## If the tool is sox, you have to define the pitch shift (amount of 100ths of semintone)
## FREQSHIFT_PITCH
FREQSHIFT_PITCH=-1500

## CHANNELS holds the variable that corresponds to the number of channels the
## sound card supports.

CHANNELS=1

## PRIVACY_THRESHOLD can be set to enable sensitivity to Human sounds. This
## setting is an effort to introduce privacy into the data collection.
## The PRIVACY_THRESHOLD value represents a percentage of the entire species
## list used during analysis. If a human sound is predicted anywhere within
## the precentile set below, no data is collected for that audio chunk.
## Valid range: 0-3

PRIVACY_THRESHOLD=1

## RECORDING_LENGTH: seconds of each recorded and analysed file (3-60)

RECORDING_LENGTH=15

## LOCATION_CHECK: 1 = at boot, compare the network position (public IP geolocation) with LATITUDE/LONGITUDE and ask
## on the Now page when it is farther than the current location's radius, at least LOCATION_IP_ERROR_KM; 0 = off
LOCATION_CHECK=1
## GEOLOCATION_API_KEY: a Google Geolocation API key (optional): the station finds its position by the Wi-Fi around it
## as Google Maps does; empty = BeaconDB (free, no key), then the IP position
GEOLOCATION_API_KEY=
## LOCATION_IP_ERROR_KM: how far off the network (IP) position can be (default 30 km); the boot check never asks for less
## (the phone's GPS uses the location's radius as it is)
LOCATION_IP_ERROR_KM=30

## APP_THEME: colours of the app (Settings › Theme): ocean (default), dark, forest,
## blossom, white, red or custom1, custom2...; a location can have its own (Settings › Locations:
## Home is ocean and the test location red unless changed)
APP_THEME="ocean"

## EXTRACTION_LENGTH sets the length of the audio extractions that will be made
## from each BirdNET-Lite detection. An empty value will use the default of 6
## seconds.

EXTRACTION_LENGTH=3

## AUDIOFMT set the audio format that sox should use for the extractions.
## The default is mp3. Available formats are: 8svx aif aifc aiff aiffc al amb
## amr-nb amr-wb anb au avr awb caf cdda cdr cvs cvsd cvu dat dvms f32 f4 f64 f8
## fap flac fssd gsm gsrt hcom htk ima ircam la lpc lpc10 lu mat mat4 mat5 maud
## mp2 mp3 nist ogg paf prc pvf raw s1 s16 s2 s24 s3 s32 s4 s8 sb sd2 sds sf sl
## sln smp snd sndfile sndr sndt sou sox sph sw txw u1 u16 u2 u24 u3 u32 u4 u8
## ub ul uw vms voc vorbis vox w64 wav wavpcm wv wve xa xi
## Note: Most have not been tested.

AUDIOFMT=flac

## SILENCE_UPDATE_INDICATOR is for quieting the display of how many commits
## your installation is behind by, relative to the Github repo. This number
## appears next to "System" when you're 50 or more commits behind.

SILENCE_UPDATE_INDICATOR=0

## AUTOMATIC_UPDATE is for specifying that the installation is automatically
## updated from the Github repo, on the days and at the time below (local time)

AUTOMATIC_UPDATE=0
## AUTOMATIC_UPDATE_DAYS: days of the week, 0 = Sunday … 6 = Saturday, comma separated (owner 2026-10-25)
AUTOMATIC_UPDATE_DAYS=0
## AUTOMATIC_UPDATE_TIME: HH:MM, local time
AUTOMATIC_UPDATE_TIME=03:00

## RAW_SPECTROGRAM is for removing the axes and labels of the spectrograms
## that are generated by Sox for each detection for a cleaner appearance.

RAW_SPECTROGRAM=0

## RARE_SPECIES_THRESHOLD defines after how many days a species is considered as rare and highlighted on overview page
RARE_SPECIES_THRESHOLD=30

#------------------------------- Now page --------------------------------------#

## NOW_VIEW: how the Now page opens on a wide screen: simple, list (Full) or
## spectrogram (cards); a phone always opens in simple
NOW_VIEW=list
## NOW_ANALYZING: the Currently Analyzing spectrogram when the page opens: show or hide
NOW_ANALYZING=hide
## NOW_COUNT: detections in the list (10, 25, 50 or 100, default 25); each browser may pick another
NOW_COUNT=25
## Values the Now filters start with when switched on (filters are off when the page opens)
## NOW_LOWPROB: Low Prob = location probability below this % (5-95)
NOW_LOWPROB=40
## NOW_LOWCONF: Low Conf = confidence below this % (5-95)
NOW_LOWCONF=60
## NOW_UNCOMMON: Uncommon = species detected at most this many times since yesterday
NOW_UNCOMMON=10
## NOW_PERIOD: period searched by the filters and the search: today, 7d or all
NOW_PERIOD=today
## NOW_FILTERS_PHONE / NOW_FILTERS_DESKTOP: the filter panel of the Now page when it opens on a phone / a wider screen:
## open or closed (each browser keeps its own choice once it changed it)
NOW_FILTERS_PHONE=closed
NOW_FILTERS_DESKTOP=open
## NOW_PARAMS_PHONE / NOW_PARAMS_DESKTOP: the analysis settings box (Param.) of the Now page on a phone / a wider screen
NOW_PARAMS_PHONE=closed
NOW_PARAMS_DESKTOP=open
## REPORTS_FILTERS_PHONE / REPORTS_FILTERS_DESKTOP: the filter line of Reports › By Hour and By Week when they open on a
## phone / a wider screen: open or closed (each browser keeps its own choice once it changed it)
REPORTS_FILTERS_PHONE=closed
REPORTS_FILTERS_DESKTOP=open

#------------------------------ Notifications ----------------------------------#

## Quiet hours (HH:MM, empty = none) for the normal and the rare tier
APPRISE_QUIET_START_NORMAL=""
APPRISE_QUIET_END_NORMAL=""
APPRISE_QUIET_START_RARE=""
APPRISE_QUIET_END_RARE=""

#------------------------------- Shadow model ----------------------------------#

## The second model that runs on every recording into its own database (Detections › Model Comparison)
SHADOW_MIN_CONF=0.7
SHADOW_SENS=1.25
SHADOW_GEO_THRESH=0.99

#------------------------------- Field access ----------------------------------#

## Plan A, the station's own WiFi (scripts/field_daemon.py, read on every round); with the cable connected the WiFi stays off
## FIELD_WIFI_MODE: the station WiFi when the station has no network (cable, known WiFi or phone hotspot):
## always = on, with no time limit, until a known network is in range again; cycle = on FIELD_AP_WINDOW_MIN minutes every
## FIELD_CYCLE_MIN minutes; off = only FIELD_AP_WINDOW_MIN minutes after start-up, then the WiFi antenna is turned off
## (no station WiFi, no WiFi network, no phone hotspot; the cable still works) until the next start-up
FIELD_WIFI_MODE=always
## FIELD_BOOT_WAIT_SEC: seconds after a start-up before the station WiFi may turn on (the known networks first)
FIELD_BOOT_WAIT_SEC=60
## FIELD_LOST_WAIT_SEC: seconds without any network (cable, WiFi or phone hotspot gone) before the station WiFi turns on
FIELD_LOST_WAIT_SEC=10
## FIELD_AP_WINDOW_MIN: cycle and off modes, minutes the station WiFi stays on when no phone joins it
FIELD_AP_WINDOW_MIN=2
## FIELD_CYCLE_MIN: cycle mode, the station WiFi turns on again every so many minutes
FIELD_CYCLE_MIN=15
## FIELD_AP_IDLE_MIN: minutes after the last phone left before the station WiFi turns off (cycle and off modes, Bluetooth, the page)
FIELD_AP_IDLE_MIN=30

#-------------------------------- Web access -----------------------------------#
## HTTPS_ALWAYS: 1 = the pages only over https (http sends the browser there; the browser warns once per device about the
## station's own certificate); 0 = http (default, owner 2026-10-29, US-126): https is switched on only for a moment
## while a device reads its GPS for a location (Settings › Locations, map, GPS) and off again when the position is read
HTTPS_ALWAYS=0

#------------------------------ Raw recording ----------------------------------#

## Scheduling › Raw Recording: long unprocessed WAV files beside the analysis
## RAW_REC_ENABLED: 1 = the schedule is on
RAW_REC_ENABLED=0
## RAW_REC_DAYS: days of the week, 0 = Sunday … 6 = Saturday, comma separated
RAW_REC_DAYS=""
## RAW_REC_RECURRENT: 1 = every chosen day, 0 = only the next one, then off (default off)
RAW_REC_RECURRENT=0
## RAW_REC_START / RAW_REC_END: HH:MM:SS; an end earlier than the start ends the next day
RAW_REC_START=04:00:00
RAW_REC_END=10:00:00
## RAW_REC_SEGMENT_MIN: minutes per WAV file (max)
RAW_REC_SEGMENT_MIN=30

## UI_LANG: language of the interface (US-122): en, pt_BR, es, zh_CN, ja, de, fr, it, nl, pl or ru; empty = follow DATABASE_LANG
## (the species-name language, when the interface has it), else English
UI_LANG=

#---------------------------------- eBird -------------------------------------#
## EBIRD_REPORT_ENABLED: 1 = every week the species confirmed by ear of the last seven days and their eBird file go by e-mail
EBIRD_REPORT_ENABLED=0
## EBIRD_REPORT_FREQ: daily = every day the previous day's list, weekly = on EBIRD_REPORT_DAY the last seven days
EBIRD_REPORT_FREQ=weekly
## EBIRD_REPORT_DAY: the day of the weekly eBird e-mail, 1 = Monday ... 7 = Sunday
EBIRD_REPORT_DAY=1
## EBIRD_REPORT_TIME: the time of the weekly eBird e-mail (HH:MM)
EBIRD_REPORT_TIME=08:00
## EBIRD_REPORT_NAME: subject of the weekly eBird e-mail and name of its file; fields {start} {end} (YYYY-MM-DD, or a
## pattern such as {start:YYYYMMDD}), {week}, {year}, {station} (name), {id} (station ID), {location}
EBIRD_REPORT_NAME="{start}_{end}_BirdSuite_eBird_{id}_{location}"
## EBIRD_REPORT_SPECIES: the filter of the weekly eBird e-mail: confirmed = only the species
## confirmed by ear, minconf = every detection from EBIRD_REPORT_MIN_CONF and the confirmed ones, all = every detection
EBIRD_REPORT_SPECIES=confirmed
## EBIRD_REPORT_MIN_CONF: with minconf, the lowest confidence of a detection to count (0.7 = about 95 % right in the
## owner's reviews)
EBIRD_REPORT_MIN_CONF=0.7
## EBIRD_PAGE_MODE / EBIRD_PAGE_MIN_CONF: the filter and the minimum confidence the eBird page opens with (its Set as default)
EBIRD_PAGE_MODE=confirmed
EBIRD_PAGE_MIN_CONF=0.7
